name = "ainews-cron-trigger"
main = "worker.js"
compatibility_date = "2025-09-01"

# UTC。同一支 Worker 幫兩個 repo 準時觸發：
#   :10 → 解析度（Hugo7079/resolution），台灣 04:10，重試 06:10
#   :40 → 晨誌（Hugo7079/AI_news），台灣 04:40，重試 06:40
# 解析度刻意先跑：兩邊共用同一個 Cloudflare 帳號的 neuron 額度，它用量小。
# 第一次成功的話，第二次 workflow 會自己跳過（skip_if_done）。
[triggers]
crons = ["10 20 * * *", "40 20 * * *", "10 22 * * *", "40 22 * * *"]

[vars]
GH_WORKFLOW = "daily.yml"
GH_REF = "main"

# 哪個 cron 打哪些 repo。key 要跟上面 crons 一字不差。
[vars.TARGETS]
"10 20 * * *" = ["Hugo7079/resolution"]
"10 22 * * *" = ["Hugo7079/resolution"]
"40 20 * * *" = ["Hugo7079/AI_news"]
"40 22 * * *" = ["Hugo7079/AI_news"]

# GH_TOKEN 是 secret，不要寫在這裡（由 deploy-cron-trigger.yml 設定）。
# 它必須同時對上面所有 repo 有 Actions: Read and write。
