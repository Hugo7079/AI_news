name = "ainews-cron-trigger"
main = "worker.js"
compatibility_date = "2025-09-01"

# UTC。目標：台灣 07:30–08:00 之間產出當天的報（內容盡量新）。
#   23:28 = 台灣 07:28 主要觸發。近兩個月實測執行 2–23 分鐘（多數 5–8 分），
#           約 07:30–07:51 完成。
#   23:43 = 台灣 07:43 重試。前一次成功的話 workflow 會自己跳過；
#           前一次還在跑則排隊，等它跑完再判斷。
[triggers]
crons = ["28 23 * * *", "43 23 * * *"]

[vars]
GH_REPO = "Hugo7079/AI_news"
GH_WORKFLOW = "daily.yml"
GH_REF = "main"

# GH_TOKEN 是 secret，不要寫在這裡：
#   npx wrangler secret put GH_TOKEN
