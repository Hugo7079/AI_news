<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>晨誌 Morning Ledger</title>
  <meta name="description" content="每日 AI 情報日報：50+ 來源、LLM 抽事件、重要度排序。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css?v=20260901a" />
</head>
<body>
  <main class="sheet">

    <!-- ───────── 報頭 ───────── -->
    <header class="masthead">
      <div class="masthead-main">
        <h1 class="masthead-name">晨誌</h1>
        <p class="masthead-latin">Morning Ledger · AI Intelligence Daily</p>
      </div>

      <div class="masthead-edition">
        <p class="edition-no" id="edition-no">—</p>
        <p class="edition-date" id="range-hint"></p>
      </div>

      <div class="masthead-control">
        <label for="range-select" class="field-label">收錄範圍</label>
        <select id="range-select" class="select">
          <option value="1">今日</option>
          <option value="3">近 3 天</option>
          <option value="7">近 7 天</option>
          <option value="14">近 14 天</option>
          <option value="30">近 30 天</option>
        </select>
      </div>
    </header>

    <!-- ───────── 欄目列（分類篩選） ───────── -->
    <nav class="kicker" aria-label="欄目">
      <span class="kicker-label">欄目</span>
      <div id="interest-chips" class="kicker-items"></div>
    </nav>

    <!-- ───────── 頭版 ───────── -->
    <section class="plate" aria-labelledby="top-picks-title">
      <div class="plate-head">
        <h2 class="rubric" id="top-picks-title">今日頭版</h2>
        <button type="button" id="pick-panel-toggle" class="rubric-action"
                aria-expanded="true" aria-controls="pick-panel">
          <span id="pick-toggle-label">收合編輯台</span>
        </button>
      </div>

      <div class="picks-layout" id="picks-layout">
        <div id="top-picks" class="frontpage"></div>

        <aside class="deskpanel" id="pick-panel" aria-label="編輯台：頭版取材標準">
          <div class="deskpanel-head">
            <p class="deskpanel-title">編輯台</p>
            <p class="deskpanel-sub">勾選取材標準，頭版會依這些標準重新選稿與排序</p>
          </div>
          <div id="metric-list" class="metric-list"></div>
          <div class="deskpanel-foot">
            <label class="field-label" for="picks-count">刊登則數</label>
            <select id="picks-count" class="select select-sm">
              <option value="3">3 則</option>
              <option value="6" selected>6 則</option>
              <option value="9">9 則</option>
              <option value="12">12 則</option>
              <option value="20">20 則</option>
            </select>
            <button type="button" id="metric-reset" class="btn btn-ghost">重設</button>
            <button type="button" id="metric-add-all" class="btn btn-solid">頭版全部收入電子報</button>
          </div>
        </aside>
      </div>
    </section>

    <!-- ───────── 開源生態 ───────── -->
    <section class="plate" aria-labelledby="opensource-title">
      <div class="plate-head">
        <button type="button" id="os-toggle" class="rubric-toggle" aria-expanded="true" aria-controls="opensource-grid">
          <h2 class="rubric" id="opensource-title">開源生態與模型觀測站</h2>
          <svg class="chev" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"/>
          </svg>
        </button>
      </div>
      <div id="opensource-grid" class="os-grid"></div>
    </section>

    <!-- ───────── 事件資料庫 ───────── -->
    <section class="plate" aria-labelledby="db-rubric">
      <div class="plate-head">
        <h2 class="rubric" id="db-rubric">全部收錄</h2>
      </div>
      <div id="db-toolbar" class="db-toolbar"></div>
      <nav id="category-tabs" class="tabs" aria-label="分類篩選"></nav>
      <div id="event-list" class="event-list"></div>
      <nav id="db-pager" class="pager" aria-label="分頁"></nav>
    </section>

    <!-- ───────── 數據看板 ───────── -->
    <section class="plate" aria-labelledby="metrics-title">
      <div class="plate-head">
        <h2 class="rubric" id="metrics-title">本日統計</h2>
      </div>
      <div id="metrics" class="metrics"></div>
      <div class="analytics-grid">
        <section class="analytics-card">
          <h3 class="analytics-title">熱門被提及主體</h3>
          <div id="top-entities" class="hbar-list"></div>
        </section>
        <section class="analytics-card">
          <h3 class="analytics-title">事件分類分佈</h3>
          <div id="cat-distribution"></div>
        </section>
      </div>
    </section>

    <footer class="colophon">
      <p>晨誌 Morning Ledger — 每日 06:00 自動編成。事件由語言模型自新聞原文抽取、合併並評分，標題連結一律指向原始報導。</p>
    </footer>

  </main>

  <script type="module" src="./app.js?v=20260901a"></script>
</body>
</html>
