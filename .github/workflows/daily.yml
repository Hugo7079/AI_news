name: Daily AI news crawl

on:
  schedule:
    # 台灣時間 02:40 起每小時一個時段（18:40 / 19:40 / 20:40 / 21:40 UTC）。
    # 目標：台灣 08:00 前一定有當天的報。
    #
    # GitHub Actions 的 cron 只是「排進佇列」，不保證準時，甚至會整個被丟掉：
    #   - 先前實測延遲 15 分到 8 小時不等（HH:00 尖峰最嚴重，所以分鐘用 40）
    #   - 2026-11-02 那次延遲 6 小時（台灣 10:37 才跑）
    #   - 2026-11-03 20:40 UTC 那次直接沒觸發
    #   - 2026-11-05 四個時段（台灣 04:40–07:40）延遲到 09:01 才跑
    # 所以這裡只當保底：提早到 02:40 起跑，延遲 5 小時左右仍趕得上 08:00。
    # 代價是 GitHub 若剛好準時，當天內容會在凌晨就截止（之後的新聞進隔天的報）。
    #
    # 主力是 cron-trigger/ 的 Cloudflare Worker：台灣 04:40 / 05:40 / 06:40
    # 準點打 workflow_dispatch（見 README「排程可靠性」）。
    #
    # 下面的 check job 確保「台灣當天已經成功過就不再跑」，
    # 不會重複燒 Cloudflare 生圖額度；前一個失敗的話，後面的時段等於自動重試。
    - cron: "40 18 * * *"
    - cron: "40 19 * * *"
    - cron: "40 20 * * *"
    - cron: "40 21 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "抓近 N 天"
        required: false
        default: "1"
      enable_google_news:
        description: "啟用 Google News 補強"
        type: boolean
        required: false
        default: false
      skip_if_done:
        description: "台灣當天已有成功的一次就跳過（外部排程用；手動跑不用勾）"
        type: boolean
        required: false
        default: false

# 同一時間只跑一個。後到的會排隊，等前一個結束後由 check job 判斷要不要跳過。
concurrency:
  group: daily-crawl
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SKIP_IF_DONE: ${{ github.event.inputs.skip_if_done }}
        run: |
          # 手動觸發（沒勾 skip_if_done）一律照跑
          if [ "$EVENT" != "schedule" ] && [ "$SKIP_IF_DONE" != "true" ]; then
            echo "手動觸發，照跑"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 台灣當天 00:00 換成 UTC
          SINCE=$(date -u -d "@$(TZ=Asia/Taipei date -d 'today 00:00' +%s)" +%Y-%m-%dT%H:%M:%SZ)
          DONE=$(gh run list --workflow daily.yml --status success --created ">=$SINCE" \
                   --limit 50 --json databaseId \
                   --jq "[.[] | select(.databaseId != $GITHUB_RUN_ID)] | length")
          if [ "$DONE" -gt 0 ]; then
            echo "台灣當天（$SINCE 之後）已有 $DONE 次成功，跳過"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "台灣當天還沒成功過，開跑"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  crawl:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          # LLM：d8ai gateway（litellm proxy，OpenAI 相容）
          # secret 名稱刻意與環境變數同名，省掉一層對照
          AINEWS_LLM_API_KEY:           ${{ secrets.AINEWS_LLM_API_KEY }}
          AINEWS_LLM_BASE_URL:          "https://llm-gateway.d8ai.ai/"
          AINEWS_LLM_MODEL:             "gemma-4-31B-it"
          AINEWS_LLM_RPM:               "45"
          # 封面生圖：Cloudflare Workers AI（FLUX.1 [schnell]，免費 10,000 neurons/天）
          AINEWS_IMAGE_BACKEND:         "cloudflare"
          AINEWS_CF_ACCOUNT_ID:         ${{ secrets.AINEWS_CF_ACCOUNT_ID }}
          AINEWS_CF_API_TOKEN:          ${{ secrets.AINEWS_CF_API_TOKEN }}
          # 封面存放預設走 Firebase Storage（需 Blaze 方案）。
          # 下面三個 R2 secret 有設才會改走 Cloudflare R2；沒設就留空、不影響。
          AINEWS_R2_ACCESS_KEY_ID:      ${{ secrets.AINEWS_R2_ACCESS_KEY_ID }}
          AINEWS_R2_SECRET_ACCESS_KEY:  ${{ secrets.AINEWS_R2_SECRET_ACCESS_KEY }}
          AINEWS_R2_BUCKET:             ainews-covers
          AINEWS_R2_PUBLIC_BASE:        ${{ secrets.AINEWS_R2_PUBLIC_BASE }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          GOOGLE_FLAG=""
          if [ "${{ github.event.inputs.enable_google_news }}" = "true" ]; then
            GOOGLE_FLAG="--google"
          fi
          python3 src/pipeline.py --days "$DAYS" $GOOGLE_FLAG
