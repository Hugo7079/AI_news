name: Daily AI news crawl

on:
  schedule:
    # 20:40 UTC = 台灣時間 04:40。目標是「08:30 之前一定看得到」。
    #
    # 為什麼要提前這麼多：GitHub Actions 的 cron 只是「排進佇列」，不保證準時。
    # 實測最近 15 次（原本排 22:00 UTC）的實際開始時間：
    #   22:14–22:19  延遲 15–20 分
    #   23:43–23:48  延遲 1h45（最近三次都是）
    #   00:07、00:55 延遲 2–3h
    #   02:46、03:26 延遲 4.5–5.5h
    #   05:53        延遲 8h
    # 加上執行本身要 16–48 分鐘，排在 06:00 常常拖到 08:30 之後才跑完。
    #
    # 分鐘刻意用 40 而不是整點 —— HH:00 是全球尖峰，延遲最嚴重。
    # 04:40 起跑就算延遲 3 小時、再跑滿 48 分鐘，08:30 前仍然完成。
    - cron: "40 20 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "抓近 N 天"
        required: false
        default: "1"
      enable_google_news:
        description: "啟用 Google News 補強"
        type: boolean
        required: false
        default: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          # LLM：Mistral La Plateforme（免費 Experiment tier）
          AINEWS_LLM_API_KEY:           ${{ secrets.MISTRAL_API_KEY }}
          AINEWS_LLM_BASE_URL:          "https://api.mistral.ai/v1"
          AINEWS_LLM_MODEL:             "mistral-small-latest"
          AINEWS_LLM_RPM:               "45"
          # 封面生圖：Cloudflare Workers AI（FLUX.1 [schnell]，免費 10,000 neurons/天）
          AINEWS_IMAGE_BACKEND:         "cloudflare"
          AINEWS_CF_ACCOUNT_ID:         ${{ secrets.CF_ACCOUNT_ID }}
          AINEWS_CF_API_TOKEN:          ${{ secrets.CF_API_TOKEN }}
          # 封面存放預設走 Firebase Storage（需 Blaze 方案）。
          # 下面三個 R2 secret 有設才會改走 Cloudflare R2；沒設就留空、不影響。
          AINEWS_R2_ACCESS_KEY_ID:      ${{ secrets.R2_ACCESS_KEY_ID }}
          AINEWS_R2_SECRET_ACCESS_KEY:  ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AINEWS_R2_BUCKET:             ainews-covers
          AINEWS_R2_PUBLIC_BASE:        ${{ secrets.R2_PUBLIC_BASE }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          DAYS="${{ github.event.inputs.days || '1' }}"
          GOOGLE_FLAG=""
          if [ "${{ github.event.inputs.enable_google_news }}" = "true" ]; then
            GOOGLE_FLAG="--google"
          fi
          python3 src/pipeline.py --days "$DAYS" $GOOGLE_FLAG
